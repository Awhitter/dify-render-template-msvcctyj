# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# HLT Dify on Render: pinned live core configuration (29 October 2026)
# Repo: https://github.com/render-examples/dify-render-template
# Upstream: https://github.com/langgenius/dify
# Images: https://hub.docker.com/u/langgenius
#
# Dify 1.18.0. Blueprint auto-sync stays paused until its proposed diff is reviewed.
# Plugin daemon and dify-beat already exist outside this Blueprint; do not create duplicates.
# See OPERATIONS.md for resource identities and restart/upgrade verification.

previews:
  generation: "off"

projects:
  - name: dify-render-template
    environments:
      - name: production
        services:
          # API (Flask + Celery broker client)
          - type: web
            name: dify-api
            runtime: image
            plan: standard
            region: oregon
            image:
              url: docker.io/langgenius/dify-api@sha256:0120970fb4ea59aa328d63b7dda635cccc071efb8aae470cd07115a026dbffd3
            healthCheckPath: /health
            autoDeployTrigger: "off"
            initialDeployHook: psql $DATABASE_URL -c 'CREATE EXTENSION IF NOT EXISTS vector;'
            disk:
              name: dify-api-storage
              mountPath: /app/api/storage
              sizeGB: 10
            envVars:
              - key: MODE
                value: api
              - key: DEPLOY_ENV
                value: PRODUCTION
              - key: DB_TYPE
                value: postgresql
              - key: MIGRATION_ENABLED
                value: "true"
              - key: LOG_LEVEL
                value: INFO
              - key: SECRET_KEY
                generateValue: true
              - key: CONSOLE_API_URL
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: SERVICE_API_URL
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: FILES_URL
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: INTERNAL_FILES_URL
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: CONSOLE_WEB_URL
                value: https://forge.katailyst.com
              - key: APP_WEB_URL
                value: https://forge.katailyst.com
              - key: DATABASE_URL
                fromDatabase:
                  name: dify-db
                  property: connectionString
              - key: DB_USERNAME
                fromDatabase:
                  name: dify-db
                  property: user
              - key: DB_PASSWORD
                fromDatabase:
                  name: dify-db
                  property: password
              - key: DB_HOST
                fromDatabase:
                  name: dify-db
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: dify-db
                  property: port
              - key: DB_DATABASE
                fromDatabase:
                  name: dify-db
                  property: database
              - key: REDIS_HOST
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: host
              - key: REDIS_PORT
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: port
              - key: CELERY_BROKER_URL
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: connectionString
              - key: VECTOR_STORE
                value: pgvector
              - key: PGVECTOR_HOST
                fromDatabase:
                  name: dify-db
                  property: host
              - key: PGVECTOR_PORT
                fromDatabase:
                  name: dify-db
                  property: port
              - key: PGVECTOR_USER
                fromDatabase:
                  name: dify-db
                  property: user
              - key: PGVECTOR_PASSWORD
                fromDatabase:
                  name: dify-db
                  property: password
              - key: PGVECTOR_DATABASE
                fromDatabase:
                  name: dify-db
                  property: database
              - key: STORAGE_TYPE
                value: opendal
              - key: OPENDAL_SCHEME
                value: s3
              # Shared private object storage; retain the existing live values on sync.
              - key: OPENDAL_S3_ENDPOINT
                sync: false
              - key: OPENDAL_S3_REGION
                value: auto
              - key: OPENDAL_S3_BUCKET
                sync: false
              - key: OPENDAL_S3_ACCESS_KEY_ID
                sync: false
              - key: OPENDAL_S3_SECRET_ACCESS_KEY
                sync: false
              - key: PLUGIN_DAEMON_URL
                sync: false
              - key: PLUGIN_DAEMON_KEY
                sync: false
              - key: INNER_API_KEY_FOR_PLUGIN
                sync: false
              - key: PLUGIN_DIFY_INNER_API_URL
                sync: false

          # Celery worker
          - type: worker
            name: dify-worker
            runtime: image
            plan: standard
            region: oregon
            image:
              url: docker.io/langgenius/dify-api@sha256:0120970fb4ea59aa328d63b7dda635cccc071efb8aae470cd07115a026dbffd3
            autoDeployTrigger: "off"
            envVars:
              - key: MODE
                value: worker
              - key: DEPLOY_ENV
                value: PRODUCTION
              - key: DB_TYPE
                value: postgresql
              - key: SECRET_KEY
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: SECRET_KEY
              - key: DB_USERNAME
                fromDatabase:
                  name: dify-db
                  property: user
              - key: DB_PASSWORD
                fromDatabase:
                  name: dify-db
                  property: password
              - key: DB_HOST
                fromDatabase:
                  name: dify-db
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: dify-db
                  property: port
              - key: DB_DATABASE
                fromDatabase:
                  name: dify-db
                  property: database
              - key: DATABASE_URL
                fromDatabase:
                  name: dify-db
                  property: connectionString
              - key: REDIS_HOST
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: host
              - key: REDIS_PORT
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: port
              - key: CELERY_BROKER_URL
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: connectionString
              - key: VECTOR_STORE
                value: pgvector
              - key: PGVECTOR_HOST
                fromDatabase:
                  name: dify-db
                  property: host
              - key: PGVECTOR_PORT
                fromDatabase:
                  name: dify-db
                  property: port
              - key: PGVECTOR_USER
                fromDatabase:
                  name: dify-db
                  property: user
              - key: PGVECTOR_PASSWORD
                fromDatabase:
                  name: dify-db
                  property: password
              - key: PGVECTOR_DATABASE
                fromDatabase:
                  name: dify-db
                  property: database
              - key: STORAGE_TYPE
                value: opendal
              - key: OPENDAL_SCHEME
                value: s3
              # Shared private object storage; retain the existing live values on sync.
              - key: OPENDAL_S3_ENDPOINT
                sync: false
              - key: OPENDAL_S3_REGION
                value: auto
              - key: OPENDAL_S3_BUCKET
                sync: false
              - key: OPENDAL_S3_ACCESS_KEY_ID
                sync: false
              - key: OPENDAL_S3_SECRET_ACCESS_KEY
                sync: false
              - key: PLUGIN_DAEMON_URL
                sync: false
              - key: PLUGIN_DAEMON_KEY
                sync: false
              - key: INNER_API_KEY_FOR_PLUGIN
                sync: false
              - key: PLUGIN_DIFY_INNER_API_URL
                sync: false

          # Web console (Next.js)
          - type: web
            name: dify-web
            runtime: image
            plan: starter
            region: oregon
            image:
              url: docker.io/langgenius/dify-web@sha256:e55a6bf1addf109c3655567663f906624f0980061efed864e0f07d23c71fa385
            autoDeployTrigger: "off"
            envVars:
              - key: CONSOLE_API_URL
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: APP_API_URL
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              # The plugin daemon is live; Agent V2 still needs its optional
              # agent backend, sandbox and SSRF proxy. Keep it hidden.
              - key: NEXT_PUBLIC_ENABLE_AGENT_V2
                value: "false"

          # Key Value (Celery broker + cache)
          - type: keyvalue
            name: dify-kv
            plan: starter
            region: oregon
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []

        databases:
          - name: dify-db
            plan: basic-256mb
            region: oregon
            # Existing database identity is retained (live name: dify_20be).
            postgresMajorVersion: "16"
            ipAllowList: []
